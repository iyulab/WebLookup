name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
        dotnet-quality: preview

    - name: Restore
      run: dotnet restore WebLookup.slnx

    - name: Build
      run: dotnet build WebLookup.slnx --no-restore --configuration Release

    - name: Test
      # --hangdump/--hangdump-timeout is MTP's equivalent of VSTest's --blame-hang.
      run: dotnet test WebLookup.slnx --no-build --configuration Release --verbosity normal --hangdump --hangdump-timeout 5m
